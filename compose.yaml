services:
 postgres:
  image: 'postgres:16'
  environment:
   - POSTGRES_DB=${DB_NAME}
   - POSTGRES_USER=${DB_USERNAME}
   - POSTGRES_PASSWORD=${DB_PASSWORD}
  ports:
   - '${DB_PORT}:5432'
  volumes:
   - postgres_data:/var/lib/postgresql/data
  networks:
   - calendario_network
   
 pgadmin:
  image: 'dpage/pgadmin4:latest'
  environment:
   - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}
   - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
  ports:
   - '5050:80'
  depends_on:
   - postgres
  networks:
   - calendario_network
  volumes:
   - pgadmin_data:/var/lib/pgadmin
   
volumes:
 postgres_data:
 pgadmin_data:

networks:
 calendario_network:	  
